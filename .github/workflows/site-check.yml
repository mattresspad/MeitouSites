name: Site check

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "UPSTREAM.json"
      - ".github/workflows/site-check.yml"
  pull_request:
    paths:
      - "site/**"
      - "UPSTREAM.json"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
